name: PIB UPSC Daily Digest

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 AM IST (change as you like)
  workflow_dispatch: {}     # lets you run it manually to test

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests beautifulsoup4
      - run: python pib_upsc_bot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
